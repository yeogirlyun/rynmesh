[package]
name = "ryn_transport"
version = "0.1.0"
edition = "2021"
description = "Native P2P transport for Rynmesh: UDP hole punching + QUIC (quinn)"
license = "MIT"
publish = false

[lib]
name = "ryn_transport"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
# Python bindings; benchmarks and Rust tests use the crate without them.
python = ["dep:pyo3", "dep:pyo3-async-runtimes"]

[dependencies]
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
quinn-proto = { version = "0.11", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
rcgen = "0.13"
ring = "0.17"
socket2 = "0.5"
if-addrs = "0.15"
rand = "0.8"
hex = "0.4"
pyo3 = { version = "0.29", optional = true, features = ["extension-module", "abi3-py311"] }
pyo3-async-runtimes = { version = "0.29", optional = true, features = ["tokio-runtime"] }

[profile.release]
debug = false
lto = "thin"
