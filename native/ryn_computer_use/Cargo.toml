[package]
name = "ryn_computer_use"
version = "0.1.0"
edition = "2021"
description = "Ryn Native Computer Use Control Engine (wire-v1 JSONL over stdio)"
publish = false

[lib]
name = "ryn_computer_use"
path = "src/lib.rs"

[[bin]]
name = "ryn_computer_use"
path = "src/main.rs"

[[bin]]
name = "ryn_computer_use_fixture"
path = "src/bin/ryn_computer_use_fixture.rs"

[dependencies]
base64 = "0.22"
hex = "0.4"
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []
lifecycle-test-support = []
