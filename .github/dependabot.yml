version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, python]
  - package-ecosystem: npm
    directory: /webapp
    schedule:
      interval: weekly
    labels: [dependencies, webapp]
  - package-ecosystem: cargo
    directory: /webapp/src-tauri
    schedule:
      interval: weekly
    labels: [dependencies, desktop]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
