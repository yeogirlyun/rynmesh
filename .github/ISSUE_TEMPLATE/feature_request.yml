name: Feature request
description: Propose a focused improvement to Rynmesh
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem should Rynmesh solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome and how a user would experience it.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make this issue complete.
      placeholder: |
        - [ ] First observable outcome
        - [ ] Relevant automated test or verification
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Recommendations and discovery
        - Content viewer
        - Local AI and Search & Ask
        - Desktop and packaging
        - Peer mesh and messaging
        - Publishing, provenance, and safety
        - Credits and services
        - Contributor experience and documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
