name: Verify and upload desktop draft

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful signed desktop build run
        required: true
        type: string
      release_id:
        description: Existing draft release ID (never publishes or creates a tag)
        required: true
        type: string
      source_sha:
        description: Exact source commit expected in the build run
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ inputs.release_id }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RYN_DESKTOP_UPDATE_PUBLIC_KEY: ${{ vars.RYN_DESKTOP_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: update-*
          merge-multiple: true
          path: update-assets
      - run: python -m pip install 'cryptography>=48,<51'
      - name: Verify signatures, assemble manifest, and upload only to the existing draft
        run: python scripts/upload_desktop_draft.py
