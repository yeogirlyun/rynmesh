name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contribution-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test exclusive reservation state machine
        run: node --test .github/scripts/contribution-claims.test.cjs

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Lint
        run: python -m ruff check rynmesh/ tests/

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npx tsc -b
      - name: Build
        run: npm run build

  llm-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Deterministic strict P2P private LLM flow
        run: python scripts/llm_e2e.py run
      - name: Deterministic encrypted-relay private LLM flow
        run: python scripts/llm_e2e.py relay-run
      - name: Deterministic direct stream-v1 timing and settlement flow
        run: python scripts/llm_e2e.py stream-run
      - name: Clean up isolated E2E stack
        if: always()
        run: python scripts/llm_e2e.py down

  packaged-node:
    # The release form: the node must serve its own UI with no dev server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: python -m pip install -e ".[dev]" build
      - run: cd webapp && npm ci && npm run build
      - name: Fold UI into the package and start the node
        run: |
          cp -R webapp/dist rynmesh/webui
          RYNMESH_HOME="$RUNNER_TEMP/node" RYNMESH_AUTO_REGISTER=0 \
            python -m rynmesh.peer_http &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8791/health 2>/dev/null | grep -q peer_id && break
            sleep 0.5
          done
      - name: Verify the packaged node serves the app
        run: |
          curl -fsS http://127.0.0.1:8791/health | grep -q peer_id
          curl -fsS http://127.0.0.1:8791/ | grep -qi "<!doctype html"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/digest)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/assets/nope.js)" = 404

  desktop-compile:
    name: desktop-compile (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build production web interface
        run: npm run build
      - name: Build self-contained node sidecar
        run: ./src-tauri/scripts/build-sidecar.sh
      - name: Start bundled node sidecar
        run: |
          sidecar="$(find src-tauri/binaries -type f -name 'rynmesh-peer-*' -print -quit)"
          ./src-tauri/scripts/verify-sidecar.sh "$sidecar"
      - name: Compile desktop shell
        run: cargo check --manifest-path src-tauri/Cargo.toml

  linux-desktop-package:
    name: Linux desktop package (Ubuntu 24.04 x86_64)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri and smoke-test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl dbus-x11 file libayatana-appindicator3-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf \
            xauth xvfb
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build production web interface
        run: npm run build
      - name: Build and verify x86_64 frozen sidecar
        run: |
          ./src-tauri/scripts/build-sidecar.sh
          triple="$(rustc -Vv | sed -n 's/^host: //p')"
          test "$triple" = x86_64-unknown-linux-gnu
          sidecar="src-tauri/binaries/rynmesh-peer-$triple"
          file "$sidecar" | grep -Eq 'ELF 64-bit.*x86-64'
          ./src-tauri/scripts/verify-sidecar.sh "$sidecar"
      - name: Test desktop shell platform helpers
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Debian package
        run: npm run tauri build -- --bundles deb
      - name: Inspect Debian package
        run: |
          mapfile -t packages < <(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print)
          test "${#packages[@]}" -eq 1
          ./src-tauri/scripts/verify-linux-deb.sh "${packages[0]}" "$(node -p 'require("./package.json").version')"
          cp "${packages[0]}" Ryn-linux-x86_64.deb
          sha256sum Ryn-linux-x86_64.deb > Ryn-linux-x86_64.deb.sha256
      - name: Install and smoke-test desktop package
        run: |
          sudo apt-get install -y "$PWD/Ryn-linux-x86_64.deb"
          desktop_file="$(find /usr/share/applications -maxdepth 1 -iname '*ryn*.desktop' -print -quit)"
          test -n "$desktop_file"
          dbus-run-session -- ./src-tauri/scripts/smoke-linux-desktop.sh "$desktop_file"
      - uses: actions/upload-artifact@v6
        with:
          name: Ryn-linux-x86_64
          path: |
            webapp/Ryn-linux-x86_64.deb
            webapp/Ryn-linux-x86_64.deb.sha256
