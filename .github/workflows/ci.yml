name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Lint
        run: python -m ruff check rynmesh/ tests/

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Build
        run: npm run build

  packaged-node:
    # The release form: the node must serve its own UI with no dev server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - run: python -m pip install -e ".[dev]" build
      - run: cd webapp && npm ci && npm run build
      - name: Fold UI into the package and start the node
        run: |
          cp -R webapp/dist rynmesh/webui
          RYNMESH_HOME="$RUNNER_TEMP/node" RYNMESH_AUTO_REGISTER=0 \
            python -m rynmesh.peer_http &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8791/health 2>/dev/null | grep -q peer_id && break
            sleep 0.5
          done
      - name: Verify the packaged node serves the app
        run: |
          curl -fsS http://127.0.0.1:8791/health | grep -q peer_id
          curl -fsS http://127.0.0.1:8791/ | grep -qi "<!doctype html"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/digest)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/assets/nope.js)" = 404
