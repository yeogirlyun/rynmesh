name: Release package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Build web interface
        working-directory: webapp
        run: npm ci && npm run build
      - name: Build Python distributions
        run: |
          rm -rf rynmesh/webui
          cp -R webapp/dist rynmesh/webui
          python -m pip install --upgrade build
          python -m build
      - name: Verify wheel
        run: |
          python -m venv "$RUNNER_TEMP/verify"
          "$RUNNER_TEMP/verify/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/verify/bin/python" -c 'from rynmesh.peer_http import webui_dir; assert (webui_dir() / "index.html").is_file()'
      - name: Prepare release metadata
        run: |
          version="${GITHUB_REF_NAME#v}"
          wheel="$(basename dist/rynmesh-${version}-*.whl)"
          sha="$(sha256sum "dist/$wheel" | awk '{print $1}')"
          cp scripts/install.sh dist/install.sh
          (cd dist && sha256sum *.whl > SHA256SUMS)
          printf '{\n  "version": "%s",\n  "wheel": "https://github.com/yeogirlyun/rynmesh/releases/download/v%s/%s",\n  "sha256": "%s",\n  "install": "https://github.com/yeogirlyun/rynmesh/releases/latest/download/install.sh"\n}\n' \
            "$version" "$version" "$wheel" "$sha" > dist/latest.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  macos-desktop:
    name: macOS desktop (${{ matrix.arch }})
    needs: python-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install web dependencies
        working-directory: webapp
        run: npm ci
      - name: Build production web interface
        working-directory: webapp
        run: npm run build
      - name: Build self-contained node sidecar
        run: ./webapp/src-tauri/scripts/build-sidecar.sh
      - name: Build desktop disk image
        working-directory: webapp
        run: npm run tauri build -- --bundles dmg
      - name: Name release artifact
        run: |
          dmg="$(find webapp/src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$dmg"
          cp "$dmg" "Ryn-${GITHUB_REF_NAME#v}-macos-${{ matrix.arch }}.dmg"
      - name: Verify desktop signature and bundled daemon
        run: |
          mount_dir="$(mktemp -d)"
          hdiutil attach "Ryn-${GITHUB_REF_NAME#v}-macos-${{ matrix.arch }}.dmg" -mountpoint "$mount_dir" -nobrowse -readonly >/dev/null
          trap 'hdiutil detach "$mount_dir" >/dev/null' EXIT
          app="$mount_dir/Ryn.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          test -x "$app/Contents/MacOS/rynmesh-peer"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "${GITHUB_REF_NAME#v}"
          ./webapp/src-tauri/scripts/verify-sidecar.sh "$app/Contents/MacOS/rynmesh-peer"
      - name: Upload desktop artifact to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "Ryn-${GITHUB_REF_NAME#v}-macos-${{ matrix.arch }}.dmg" --clobber

  linux-desktop:
    name: Linux desktop (Ubuntu 24.04 x86_64)
    needs: python-package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri and smoke-test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl dbus-x11 file libayatana-appindicator3-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf \
            xauth xvfb
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install web dependencies
        working-directory: webapp
        run: npm ci
      - name: Build production web interface
        working-directory: webapp
        run: npm run build
      - name: Build self-contained Linux sidecar
        run: ./webapp/src-tauri/scripts/build-sidecar.sh
      - name: Build Debian package
        working-directory: webapp
        run: npm run tauri build -- --bundles deb
      - name: Name, checksum, and inspect release artifact
        run: |
          mapfile -t packages < <(find webapp/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print)
          test "${#packages[@]}" -eq 1
          artifact="Ryn-${GITHUB_REF_NAME#v}-linux-x86_64.deb"
          cp "${packages[0]}" "$artifact"
          ./webapp/src-tauri/scripts/verify-linux-deb.sh "$artifact" "${GITHUB_REF_NAME#v}"
          sha256sum "$artifact" > "$artifact.sha256"
      - name: Install and smoke-test release artifact
        run: |
          artifact="Ryn-${GITHUB_REF_NAME#v}-linux-x86_64.deb"
          sudo apt-get install -y "$PWD/$artifact"
          desktop_file="$(find /usr/share/applications -maxdepth 1 -iname '*ryn*.desktop' -print -quit)"
          test -n "$desktop_file"
          dbus-run-session -- ./webapp/src-tauri/scripts/smoke-linux-desktop.sh "$desktop_file"
      - name: Upload Linux artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="Ryn-${GITHUB_REF_NAME#v}-linux-x86_64.deb"
          gh release upload "$GITHUB_REF_NAME" "$artifact" "$artifact.sha256"
