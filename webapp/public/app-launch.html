<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ryn</title>
<!-- Shown by the desktop app while a Start menu or "Open with" app is still starting
     (src-tauri/src/system_apps). The app's name and icon arrive as window.__rynLaunch. -->
<style>
  :root { color-scheme: light dark; --bg: #f6f7fb; --ink: #161b2e; --muted: #5d6478; --track: #dde2ee; --bar: #3556d3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141821; --ink: #eef1f8; --muted: #9aa3b8; --track: #2a3142; --bar: #7d9bff; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 14px/1.4 "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; user-select: none; }
  main { display: grid; justify-items: center; gap: 10px; }
  img { width: 56px; height: 56px; }
  h1 { margin: 4px 0 0; font-size: 17px; font-weight: 650; }
  p { margin: 0; color: var(--muted); font-size: 13px; }
  .bar { position: relative; overflow: hidden; width: 160px; height: 3px; margin-top: 6px; border-radius: 3px; background: var(--track); }
  .bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 3px; background: var(--bar);
    animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; opacity: .5; } }
</style>
</head>
<body>
<main>
  <img id="icon" alt="" hidden>
  <h1 id="name">Ryn</h1>
  <p id="status">Starting…</p>
  <div class="bar" role="progressbar" aria-label="Starting"></div>
</main>
<script>
  const launch = window.__rynLaunch || {};
  const chinese = /^zh\b/i.test(navigator.language || "");
  if (typeof launch.name === "string") { document.getElementById("name").textContent = launch.name; document.title = launch.name; }
  if (typeof launch.icon === "string" && launch.icon.startsWith("data:image/png;base64,")) {
    const icon = document.getElementById("icon"); icon.src = launch.icon; icon.hidden = false;
  }
  document.getElementById("status").textContent = chinese ? "正在启动…" : "Starting…";
  document.documentElement.lang = chinese ? "zh-CN" : "en";
</script>
</body>
</html>
