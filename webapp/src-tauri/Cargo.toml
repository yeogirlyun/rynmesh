[package]
name = "app"
version = "0.8.0"
description = "Ryn — desktop shell for the Rynmesh node"
authors = ["Rynmesh Contributors"]
license = "MIT"
repository = "https://github.com/yeogirlyun/rynmesh"
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2.9.0"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-notification = "2.3.3"
tauri-plugin-updater = "=2.14.0"
libc = "0.2"
rfd = "0.15"
base64 = "0.22"
png = "0.17"

# Start menu shortcuts, taskbar identity and "Open with" registration for apps.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
