<script>
(()=>{
const root=document.getElementById('ryn-drop'),view=root.querySelector('#rd-view'),overlay=root.querySelector('#rd-overlay');
const icon=(name)=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const devices=[{id:'nas',name:'家里的 NAS',os:'Linux',kind:'server',group:'mine',route:'公网直连',routeIcon:'globe',meta:'38 ms',online:true},{id:'mac',name:'MacBook Pro',os:'macOS',kind:'laptop',group:'mine',route:'局域网直连',routeIcon:'wifi',meta:'2 ms',online:true},{id:'studio',name:'工作室电脑',os:'Windows',kind:'monitor',group:'mine',route:'离线',routeIcon:'moon',meta:'上次在线 2 小时前',online:false},{id:'phone',name:'我的 iPhone',os:'iOS · 移动端规划',kind:'phone',group:'mine',route:'公网直连',routeIcon:'globe',meta:'56 ms',online:true},{id:'lin',name:'小林的 MacBook',os:'macOS · 好友设备',kind:'laptop',group:'friend',route:'中继连接',routeIcon:'waypoints',meta:'84 ms',online:true},{id:'near',name:'附近的 MacBook',os:'macOS · 未配对',kind:'laptop',group:'nearby',route:'局域网',routeIcon:'wifi',meta:'尚未验证身份',online:true}];
const state={tab:'devices',group:'mine',device:'nas',menu:'nas',paused:false,filter:'all',messages:{},added:[],selectedFiles:[{name:'旅行素材_2026.zip',size:'100 GB',bytes:100000000000,type:'archive'},{name:'拍摄清单.pdf',size:'2.4 MB',bytes:2400000,type:'file-text'}],received:false,modal:null,notice:'',resumeFailed:false};
const initial=window.openai?.widgetState?.privateContent;if(initial&&['devices','chat','transfers'].includes(initial.tab)){state.tab=initial.tab;state.menu=null;}
let restoreFocus=null;
state.menu=null;
function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});root.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));}
function save(){window.openai?.setWidgetState?.({modelContent:{screen:state.tab,selectedDevice:dev().name},privateContent:{tab:state.tab}})?.catch(()=>{});}
function dev(id=state.device){return devices.find(d=>d.id===id)||devices[0];}
function art(d){return `<div class="rd-art ${d.kind}" aria-hidden="true"></div>`;}
function route(d){return `<span class="rd-pill ${d.online?'':'rd-offline'}">${icon(d.routeIcon)}${d.route}</span>`;}
function toast(text){const t=root.querySelector('#rd-toast');t.textContent=text;t.hidden=false;}
function go(tab){state.tab=tab;state.menu=null;close();render();save();}

function drawNetwork(){
  const map=view.querySelector('.rd-map');if(!map)return;
  const svg=map.querySelector('.rd-map-wires'),bounds=map.getBoundingClientRect();
  if(!bounds.width)return;
  svg.setAttribute('viewBox',`0 0 ${bounds.width} ${bounds.height}`);
  const point=(id)=>{const el=map.querySelector(`[data-port="${id}"]`);if(!el)return null;const r=el.getBoundingClientRect();return {left:r.left-bounds.left,right:r.right-bounds.left,top:r.top-bounds.top,bottom:r.bottom-bounds.top,x:r.left+r.width/2-bounds.left,y:r.top+r.height/2-bounds.top};};
  const mobile=bounds.width<430,links=[];
  const add=(from,to,kind,vertical=false)=>{const a=point(from),b=point(to);if(!a||!b)return;let d;if(vertical){const mid=(a.bottom+b.top)/2;d=`M ${a.x} ${a.bottom+3} C ${a.x} ${mid} ${b.x} ${mid} ${b.x} ${b.top-5}`;}else{const mid=(a.right+b.left)/2;d=`M ${a.right+3} ${a.y} C ${mid} ${a.y} ${mid} ${b.y} ${b.left-4} ${b.y}`;}links.push(`<path class="${kind} ${state.device===to?'selected':''}" d="${d}"/>`);};
  const online=devices.filter(d=>d.group===state.group&&d.online),remote=online.filter(d=>!d.route.includes('局域网'));
  online.filter(d=>d.route.includes('局域网')).forEach(d=>add('self',d.id,'lan'));
  if(remote.length){add('self','internet',remote.every(d=>d.route==='中继连接')?'relay':'public',mobile);remote.forEach(d=>add('internet',d.id,d.route==='中继连接'?'relay':'public'));}
  svg.innerHTML=links.join('');
}

function openDeviceContext(id,x,y){

function sendSheet(id,folder=false){state.device=id;state.modal='send';const d=dev();if(folder)state.selectedFiles=[{name:'旅行素材 /',size:'100 GB · 248 个文件',bytes:100000000000,type:'folder'}];const sum=state.selectedFiles.reduce((s,f)=>s+f.bytes,0);show(`<section class="rd-sheet" role="dialog" aria-modal="true" aria-label="发送文件">${head('发送'+(folder?'文件夹':'文件'))}<p class="rd-sheet-sub">直接送到另一台设备。</p><div class="rd-recipient">${art(d)}<div class="rd-grow"><strong>${d.name}</strong><p>${d.group==='mine'?'我的设备':d.group==='nearby'?'未配对设备':'好友设备'} · ${d.os}</p></div>${route(d)}</div><div class="rd-between"><h3>准备发送</h3><span class="rd-small rd-muted">${state.selectedFiles.length} 项 · ${fileSize(sum)}</span></div><div class="rd-filelist">${state.selectedFiles.map((f,i)=>`<div class="rd-fileline"><div class="rd-fileicon">${icon(f.type)}</div><div class="rd-grow"><div class="rd-filename">${esc(f.name)}</div><div class="rd-small">${esc(f.size)}</div></div><button class="rd-button rd-ghost rd-icon-button" data-remove="${i}" aria-label="移除${esc(f.name)}">${icon('x')}</button></div>`).join('')}</div><div class="rd-droparea" id="rd-droparea">${icon('plus')}<button class="rd-link" data-action="pick-files">添加文件</button><span class="rd-muted">或拖到这里</span></div><input type="file" multiple id="rd-file-input" hidden><label class="rd-field" for="rd-caption">附带一句话（可选）</label><input class="rd-input" id="rd-caption" placeholder="例如：这次旅行的原片，记得备份。"><div class="rd-note">${icon(d.online?'lock-keyhole':'clock-3')}<div><strong>${!d.online?'设备离线，先保留在本机':d.group==='nearby'?'先核对身份，再发送':d.route==='中继连接'?'当前通过中继连接':'直连发送，不设文件大小上限'}</strong>${!d.online?'设备上线后重新连接。此时文件尚未上传或送达。':d.group==='nearby'?'双方比对验证码，对方同意后才开始传输。':d.route==='中继连接'?'中继额度与大小限制以实际服务为准。发送前检查可用额度。':'端到端加密 · 支持断点续传。发送前会检查接收端可用空间。'}</div></div><div class="rd-sheet-footer"><span class="rd-small rd-muted">${d.group==='mine'?'按设备接收偏好处理':'对方接受后开始传输'}</span><button class="rd-button rd-primary" data-action="confirm-send" ${state.selectedFiles.length?'':'disabled'}>${icon('send')}${!d.online?'加入待发送':d.group==='nearby'?'核对并发送':'发送'}</button></div></section>`);state.modal='send';}
function incoming(){show(`<section class="rd-modal" role="dialog" aria-modal="true" aria-label="接收文件请求"><div class="rd-between"><div class="rd-modal-mark">${icon('download')}</div><button class="rd-button rd-ghost rd-icon-button" data-action="close" aria-label="稍后处理">${icon('x')}</button></div><h2>${state.received?'文件已开始接收':'小林想发给你一个文件'}</h2><p>小林的 MacBook · 已配对好友 · 中继连接</p><div class="rd-fileline"><div class="rd-fileicon">${icon('folder')}</div><div><div class="rd-filename">品牌素材.zip</div><div class="rd-small">1.8 GB · 1 个文件</div></div></div><label class="rd-field" for="rd-destination">保存到</label><select id="rd-destination" class="rd-input"><option>下载 / Ryn</option><option>桌面 / Ryn 收件箱</option></select><p class="rd-small">可用 286 GB · 接收后自动校验完整性</p><label class="rd-check"><input type="checkbox" id="rd-autoaccept"><span>以后自动接收这台好友设备的文件<br>可在设备接收偏好中关闭</span></label><div class="rd-modal-footer"><button class="rd-button" data-action="decline">拒绝</button><button class="rd-button rd-primary" data-action="accept">${icon('download')}接收文件</button></div></section>`,true);state.modal='incoming';}
function routeSheet(id=state.device){state.device=id;const d=dev();show(`<section class="rd-sheet" role="dialog" aria-modal="true" aria-label="连接详情">${head('连接详情')}<p class="rd-sheet-sub">${d.name}</p><div class="rd-route-diagram"><div>${icon('monitor')}<div>工作电脑</div></div><div class="rd-route-line"></div>${d.route==='中继连接'?`<div>${icon('waypoints')}<div>加密中继</div></div><div class="rd-route-line"></div>`:''}<div>${icon('server')}<div>${d.name}</div></div></div><dl class="rd-kv"><dt>连接方式</dt><dd>${d.route}</dd><dt>往返延迟</dt><dd>${d.online?d.meta:'—'}</dd><dt>加密状态</dt><dd>${d.online?'端到端加密':'等待连接'}</dd><dt>设备关系</dt><dd>${d.group==='mine'?'我的设备 · 已配对':d.group==='friend'?'好友设备 · 已配对':'附近设备 · 尚未验证'}</dd><dt>直连大小限制</dt><dd>不设人为上限</dd><dt>中断后</dt><dd>保留进度，连接恢复后续传</dd></dl><div class="rd-note">${icon('info')}<div>${d.route==='中继连接'?'当前直连未建立，通过中继转发加密数据。中继额度、费用和大小限制需要单独提示。':'连接路径由 Ryn 自动选择。大文件仍需足够的接收端空间；连接变化时保留已传进度。'}</div></div><div class="rd-sheet-footer"><button class="rd-button" data-chat="${d.id}">${icon('message-circle')}打开设备会话</button></div></section>`);state.modal='route';}
function confirmSend(){const d=dev();if(d.group==='nearby'){show(`<section class="rd-modal" role="dialog" aria-modal="true" aria-label="确认附近设备身份">${head('核对设备身份')}<p>请确认「附近的 MacBook」显示相同验证码。</p><div style="font-size:30px;letter-spacing:8px;text-align:center;padding:24px;background:var(--rd-soft);border-radius:10px;margin-top:20px">482 916</div><p>此验证码仅为交互演示。真实验证码须由加密握手产生。</p><div class="rd-modal-footer"><button class="rd-button" data-action="close">取消</button><button class="rd-button rd-primary" data-action="verified-send">一致，继续</button></div></section>`,true);return;}commitSend();}
function commitSend(){const d=dev(),caption=root.querySelector('#rd-caption')?.value.trim();if(caption)(state.messages[d.id]??=[]).push(caption);const sum=state.selectedFiles.reduce((s,f)=>s+f.bytes,0);state.added.push({device:d.id,name:state.selectedFiles.length>1?state.selectedFiles[0].name+' 等 '+state.selectedFiles.length+' 项':state.selectedFiles[0].name,size:fileSize(sum),status:!d.online?'等待设备上线':d.group==='nearby'?'身份已核对 · 等待对方接收':'等待接收确认'});go('chat');toast('已创建演示发送任务；此原型不会读取文件内容或上传。');}
function simpleModal(title,body,actions){show(`<section class="rd-modal" role="dialog" aria-modal="true" aria-label="${title}">${head(title)}${body}<div class="rd-modal-footer">${actions||'<button class="rd-button rd-primary" data-action="close">知道了</button>'}</div></section>`,true);}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;if(b.dataset.tab){go(b.dataset.tab);return;}if(b.dataset.group){state.group=b.dataset.group;state.menu=null;render();return;}if(b.dataset.filter){state.filter=b.dataset.filter;render();return;}if(b.dataset.menu){state.menu=state.menu===b.dataset.menu?null:b.dataset.menu;state.device=b.dataset.menu;render();return;}if(b.dataset.chat){state.device=b.dataset.chat;go('chat');return;}if(b.dataset.send){sendSheet(b.dataset.send);return;}if(b.dataset.folder){sendSheet(b.dataset.folder,true);return;}if(b.dataset.history){state.device=b.dataset.history;go('transfers');toast('当前展示全局传输记录，正式版应按设备筛选。');return;}if(b.dataset.route){routeSheet(b.dataset.route);return;}if(b.dataset.remove!==undefined){state.selectedFiles.splice(Number(b.dataset.remove),1);sendSheet(state.device);return;}if(a==='close')close();if(a==='pause'){state.paused=!state.paused;render();}if(a==='route')routeSheet();if(a==='incoming')incoming();if(a==='pick-files')root.querySelector('#rd-file-input')?.click();if(a==='confirm-send')confirmSend();if(a==='verified-send')commitSend();if(a==='accept'){state.received=true;const auto=root.querySelector('#rd-autoaccept').checked,where=root.querySelector('#rd-destination').value;close();root.querySelector('#rd-request-count').textContent='0';toast('演示：开始接收至 '+where+(auto?'，已选择仅信任这台设备。':'。'));}if(a==='decline'){close();root.querySelector('#rd-request-count').textContent='0';toast('已拒绝这次接收请求（演示）。');}if(a==='retry'){state.resumeFailed=true;render();toast('演示：已重新连接，将从 820 MB 处继续。');}if(a==='file-location')simpleModal('保存位置','<p>下载 / Ryn / 项目说明.pdf</p><p>正式版由桌面客户端打开本地文件夹。</p>');if(a==='cancel')simpleModal('取消这次传输？','<p>当前已传 64.8 GB。取消后不会继续发送；接收端临时文件按清理策略处理。</p>','<button class="rd-button" data-action="close">继续传输</button><button class="rd-button rd-primary" data-action="cancel-confirm">取消传输</button>');if(a==='cancel-confirm'){state.paused=true;close();render();toast('演示取消确认完成。主示例保留为暂停状态，便于继续查看设计。');}if(a==='pair')simpleModal('连接你的另一台设备','<p>在另一台设备打开 Ryn，进入「设备 → 添加设备」，使用双方配对码完成连接。</p><label class="rd-field" for="rd-pair-code">另一台设备的配对码</label><input id="rd-pair-code" class="rd-input" placeholder="输入配对码（演示）"><p>手机 App 后续复用此流程，并加入扫码配对。</p>','<button class="rd-button rd-primary" data-action="pair-demo">连接设备</button>');if(a==='pair-demo'){close();toast('这是配对入口示意，真实实现接入现有配对流程。');}if(a==='visibility')simpleModal('谁能发现这台设备','<p>默认仅联系人和我的设备可见。开启附近发现后，未配对的局域网设备也能看到你。</p><label class="rd-check"><input type="checkbox" id="rd-nearby-visible"><span>临时允许附近设备发现我（10 分钟）</span></label>','<button class="rd-button rd-primary" data-action="visibility-save">保存偏好</button>');if(a==='visibility-save'){const enabled=root.querySelector('#rd-nearby-visible').checked;close();toast(enabled?'演示：已开启附近发现，10 分钟后关闭。':'演示：仅联系人和我的设备可见。');}});
function submitMessage(){const input=root.querySelector('#rd-message-input');if(!input?.value.trim())return;(state.messages[state.device]??=[]).push(input.value.trim());render();root.querySelector('#rd-message-input')?.focus();}
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='rd-message-form')submitMessage();});
root.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!overlay.hidden)close();else{state.menu=null;render();}}if(e.target.id==='rd-message-input'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submitMessage();}if(e.key==='Tab'&&!overlay.hidden){const items=[...overlay.querySelectorAll('button:not([disabled]),input:not([hidden]),select,textarea')].filter(x=>x.offsetParent!==null);if(!items.length)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
function addFiles(files){for(const f of files)state.selectedFiles.push({name:f.name,size:fileSize(f.size),bytes:f.size,type:'file'});sendSheet(state.device);}
root.addEventListener('change',e=>{if(e.target.id==='rd-file-input')addFiles(e.target.files);});
root.addEventListener('dragover',e=>{const target=e.target.closest('[data-drop-device],#rd-droparea');if(target){e.preventDefault();target.classList.add('dragging');}});
root.addEventListener('dragleave',e=>e.target.closest('.dragging')?.classList.remove('dragging'));
root.addEventListener('drop',e=>{const target=e.target.closest('[data-drop-device],#rd-droparea');if(!target)return;e.preventDefault();target.classList.remove('dragging');if(target.dataset.dropDevice){state.device=target.dataset.dropDevice;state.selectedFiles=[];}addFiles(e.dataTransfer.files);});
overlay.addEventListener('click',e=>{if(e.target===overlay)close();});
window.addEventListener('openai:set_globals',e=>{const tab=e.detail?.globals?.widgetState?.privateContent?.tab;if(['devices','chat','transfers'].includes(tab)){state.tab=tab;render();}});
render();
if(globalThis.Tweak){const design={layout:'自动',theme:'跟随系统',radius:14,screen:'设备'};const tweak=new Tweak({container:root,onChange:()=>{root.style.maxWidth=design.layout==='手机'?'390px':'none';root.style.marginInline='auto';root.style.colorScheme=design.theme==='浅色'?'light':design.theme==='深色'?'dark':'light dark';root.style.setProperty('--rd-radius',design.radius+'px');const tabs={'设备':'devices','设备会话':'chat','传输记录':'transfers'};if(tabs[design.screen]!==state.tab){state.tab=tabs[design.screen];state.menu=null;close();render();}}});tweak.addSelect(design,'layout',{label:'预览设备',options:['自动','手机']});tweak.addSelect(design,'theme',{label:'外观',options:['跟随系统','浅色','深色']});tweak.addSlider(design,'radius',{label:'卡片圆角',min:8,max:20,step:2,unit:'px'});tweak.addSelect(design,'screen',{label:'起始界面',options:['设备','设备会话','传输记录']});}
})();
</script>
